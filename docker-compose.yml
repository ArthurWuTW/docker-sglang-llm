services:

  sglang-env:
    build:
      context: ./image
      args:
        HF_TOKEN: ${TOKEN}
        VSCODE_COMMIT_ID: ${VSCODE_COMMIT_ID}
    deploy:
      resources:
        limits:
          cpus: '15'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${TOKEN}
      - MKL_NUM_THREADS=15
      - OPENBLAS_NUM_THREADS=15
      - TORCH_NUM_THREADS=4
      - MAX_JOBS=4                      # 限制 nvcc/cicc 最大同時編譯任務數為 4
      - TRITON_MAX_CPU_THREADS=4        # 限制 Triton JIT 編譯線程數
      - OMP_NUM_THREADS=4               # 限制 OpenMP 線程數
    volumes:
      - ./cache:/root/.cache:rw
    ports:
      - "11435:11435"
      - "222:22"

